    constructor() { super('vampire', 'Vampire Core', 'ฟื้น HP เมื่อโจมตี', '', 4, '#ff6b8a'); }
    apply(player) { player.vampireRate = this.level * 2; }
    getLevelDescription() { const d = ['', 'ฟื้น 2 HP', 'ฟื้น 4 HP', 'ฟื้น 6 HP', 'ฟื้น 8 HP']; return d[this.level] || this.description; }
    drawIcon(ctx, x, y, size) {
        ctx.save(); ctx.translate(x, y); ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(0, size * 0.28); ctx.bezierCurveTo(-size * 0.38, size * 0.05, -size * 0.38, -size * 0.26, 0, -size * 0.36);
        ctx.bezierCurveTo(size * 0.38, -size * 0.26, size * 0.38, size * 0.05, 0, size * 0.28);
        ctx.fill();
        ctx.restore();
    }
}

const POWER_REGISTRY = {
    'rapid': RapidFirePower, 'multi': MultiShotPower, 'pierce': PiercePower,
    'shield': ShieldPower, 'speed': SpeedPower, 'damage': DamagePower,
    'regen': RegenPower, 'repair': RepairKitPower,
    'hull': HullPower, 'armor': ArmorPower, 'pulse': PulsePower,
    'nova': NovaPower, 'orbit': OrbitPower, 'vampire': VampirePower, 'heartSlot': HeartSlotPower
};
const POWER_POOL = ['rapid', 'multi', 'pierce', 'shield', 'speed', 'damage', 'regen', 'hull', 'armor', 'pulse', 'nova', 'orbit', 'vampire', 'heartSlot'];

// ============================================
// GAME CONTROLLER - ระบบหลักทั้งหมด
// ============================================
class Game {
    constructor() {
        this.ctx = ctx;
        this.width = canvas.width;
        this.height = canvas.height;
        this.audio = new AudioManager();
        this.state = 'MENU';
        this.score = 0;
        this.highScore = 0;
        try { const s = localStorage.getItem('neonShooterFinal_v3'); if (s) this.highScore = parseInt(s); } catch (e) {}
        this.player = null;
        this.bullets = [];
        this.enemies = [];
        this.boss = null;
        this.particles = [];
        this.starsBack = [];
        this.starsFront = [];
        this.nebulas = [];
        this.initStars();
        this.input = { left: false, right: false, up: false, down: false, shoot: false };
        this.bindInput();
        this.spawnTimer = 0;
        this.spawnInterval = 55;
        this.difficulty = 1;
        this.gameTime = 0;
        this.shake = 0;
        this.gridOffset = 0;
        this.enemyIdCounter = 0;
        this.upgradeOptions = [];
        this.upgradeSelection = 0;
        this.pendingLevelUp = false;

        // --- ระบบเวลา 15 นาที ---
        this.gameDuration = 15 * 60; // 15 นาที = 900 วินาที (แต่เราใช้เฟรมนับ)
        this.gameTimer = 0; // นับเป็นเฟรม (60fps = 1 วิ = 60 เฟรม)
        this.totalFrames = 0;
        this.bossSpawned = [false, false, false]; // บอสด่าน 1,2,3 เกิดแล้วหรือยัง
        this.bossDefeated = [false, false, false];
        this.victory = false;
        this.warningTimer = 0;

        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    initStars() {
        for (let i = 0; i < 150; i++) this.starsBack.push(new Star(this.width, this.height, 0.5));
        for (let i = 0; i < 60; i++) this.starsFront.push(new Star(this.width, this.height, 1.8));
        for (let i = 0; i < 8; i++) this.nebulas.push(new Star(this.width, this.height, 0.05, true));
    }

    bindInput() {
        const setTouchState = (control, pressed) => {
            const keyMap = { left: 'left', right: 'right', up: 'up', down: 'down', shoot: 'shoot' };
            const key = keyMap[control];
            if (!key) return;
            this.input[key] = pressed;
            const button = document.querySelector(`.touch-button[data-control="${control}"]`);
            if (button) button.classList.toggle('active', pressed);
        };

        const handlePointerForControl = (control, pressed) => {
            if (this.state === 'MENU' && !pressed) return;
            setTouchState(control, pressed);
            if (pressed && (this.state === 'MENU' || this.state === 'GAMEOVER' || this.state === 'VICTORY')) {
                if (control === 'shoot' || control === 'left' || control === 'right' || control === 'up' || control === 'down') {
                    this.startGame();
                }
            }
        };

        document.querySelectorAll('.touch-button').forEach((button) => {
            const control = button.dataset.control;
            button.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                handlePointerForControl(control, true);
            });
            button.addEventListener('pointerup', (e) => {
                e.preventDefault();
                handlePointerForControl(control, false);
            });
            button.addEventListener('pointerleave', (e) => {
                e.preventDefault();
                handlePointerForControl(control, false);
            });
            button.addEventListener('pointercancel', (e) => {
                e.preventDefault();
                handlePointerForControl(control, false);
            });
        });

        const container = document.getElementById('game-container');
        container.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.touch-button')) return;
            if (this.state === 'MENU' || this.state === 'GAMEOVER' || this.state === 'VICTORY') {
                this.startGame();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            if (this.state === 'MENU' && !this.audio.isPlaying) {
                this.audio.init();
                this.audio.startBGM('menu');
            }
            if (this.state === 'MENU') {
                if (e.code === 'Space' || e.code === 'Enter') {
                    this.startGame();
                }
            }
            if (this.state === 'UPGRADE') {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.upgradeSelection = Math.max(0, this.upgradeSelection - 1);
                if (e.code === 'ArrowRight' || e.code === 'KeyD') this.upgradeSelection = Math.min(2, this.upgradeSelection + 1);
                if (e.code === 'Space' || e.code === 'Enter') this.selectUpgrade(this.upgradeSelection);
                return;
            }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.input.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') this.input.right = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') this.input.up = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') this.input.down = true;
            if (e.code === 'Space') {
                this.input.shoot = true;
                if (this.state === 'MENU') {
                    this.startGame();
                }
                if (this.state === 'GAMEOVER' || this.state === 'VICTORY') {
                    this.startGame();
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.input.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') this.input.right = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') this.input.up = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') this.input.down = false;
            if (e.code === 'Space') this.input.shoot = false;
        });
    }

    startGame() {
        this.audio.init();
        this.audio.startBGM('normal');
        this.state = 'PLAYING';
        this.score = 0;
        this.player = new Player(this.width / 2, this.height - 140);
        this.bullets = [];
        this.enemies = [];
        this.boss = null;
        this.particles = [];
        this.spawnTimer = 0;
        this.spawnInterval = 55;
        this.difficulty = 1;
        this.gameTime = 0;
        this.shake = 0;
        this.enemyIdCounter = 0;
        this.items = [];
        this.lastMinuteLevel = 0;
        this.itemDropTimer = 0;
        this.upgradeOptions = [];
        this.pendingLevelUp = false;
        this.gameTimer = 0;
        this.totalFrames = 0;
        this.bossSpawned = [false, false, false];
        this.bossDefeated = [false, false, false];
        this.victory = false;
        this.warningTimer = 0;
    }

    gameOver() {
        this.state = 'GAMEOVER';
        this.audio.stopBGM();
        if (this.score > this.highScore) {
            this.highScore = this.score;
            try { localStorage.setItem('neonShooterFinal_v3', this.highScore); } catch (e) {}
        }
        this.createExplosion(this.player.x, this.player.y, '#00ffff', 50, true);
        this.createExplosion(this.player.x, this.player.y, '#ffffff', 30, true);
    }

    winGame() {
        this.state = 'VICTORY';
        this.victory = true;
        this.audio.stopBGM();
        this.audio.playWin();
        // เอฟเฟกต์ชนะ
        for (let i = 0; i < 20; i++) {
            setTimeout(() => {
                this.createExplosion(
                    Math.random() * this.width,
                    Math.random() * this.height,
                    ['#ffdd00', '#00ff88', '#00ccff', '#ff66ff'][Math.floor(Math.random() * 4)],
                    20, true
                );
            }, i * 100);
        }
    }

    generateUpgradeOptions() {
        const options = []; const available = [];
        for (const pid of POWER_POOL) {
            if (!this.player.powers.has(pid)) {
                const PClass = POWER_REGISTRY[pid];
                available.push({ power: new PClass(), isNew: true });
            }
        }
        for (const [pid, p] of this.player.powers) {
            if (p.canUpgrade()) available.push({ power: p, isNew: false });
        }
        const usedIds = new Set();
        while (options.length < 3 && available.length > 0) {
            const idx = Math.floor(Math.random() * available.length);
            const item = available[idx];
            if (!usedIds.has(item.power.id)) { usedIds.add(item.power.id); options.push(item); }
            available.splice(idx, 1);
        }
        while (options.length < 3) options.push({ power: new RepairKitPower(), isNew: true });
        this.upgradeOptions = options; this.upgradeSelection = 1;
    }

    selectUpgrade(index) {
        if (index < 0 || index >= this.upgradeOptions.length) return;
        const selected = this.upgradeOptions[index];
        this.player.addPower(selected.power.id);
        this.state = 'PLAYING'; this.pendingLevelUp = false; this.upgradeOptions = [];
    }

    spawnEnemy() {
        const x = Math.random() * (this.width - 100) + 50;
        const rand = Math.random();
        const minuteLevel = Math.min(7, Math.floor(this.gameTimer / 30));
        const timeRatio = this.gameTimer / this.gameDuration;
        let type = 'scout';
        if (rand > 0.82 - minuteLevel * 0.03 - timeRatio * 0.05) type = 'striker';
        if (rand > 0.90 - minuteLevel * 0.04 - timeRatio * 0.06) type = 'interceptor';
        if (rand > 0.94 - minuteLevel * 0.02 - timeRatio * 0.04) type = 'drone';
        if (rand > 0.97 - minuteLevel * 0.03 - timeRatio * 0.05) type = 'bomber';
        if (rand > 0.990 - minuteLevel * 0.02 - timeRatio * 0.03) type = 'destroyer';
        if (minuteLevel >= 2 && rand > 0.995 - minuteLevel * 0.008 - timeRatio * 0.02) type = 'warden';
        if (minuteLevel >= 4 && rand > 0.998 - minuteLevel * 0.005 - timeRatio * 0.01) type = 'elite';
        this.enemies.push(new Enemy(x, -60, type, this.enemyIdCounter++, minuteLevel));
    }

    spawnRandomItem() {
        const x = Math.random() * (this.width - 120) + 60;
        const y = -30;
        const rand = Math.random();
        let type = 'heal';
        if (rand > 0.7) type = 'shield';
        if (rand > 0.92) type = 'invul';
        this.items.push(new Item(x, y, type));
    }

    applyItemPickup(item) {
        if (!this.player) return;
        if (item.type === 'heal') {
            this.player.hp = Math.min(this.player.maxHp, this.player.hp + 40);
        } else if (item.type === 'shield') {
            this.player.shieldMax = Math.max(this.player.shieldMax, 1);
            this.player.shield = Math.min(this.player.shieldMax, this.player.shield + 1);
        } else if (item.type === 'invul') {
            this.player.invulnerable = 120;
        }
        this.audio.playPickup();
        const glow = item.type === 'heal' ? '#00ff88' : item.type === 'shield' ? '#33ccff' : '#ffdd55';
        this.createExplosion(item.x, item.y, glow, 10, false);
    }

    createExplosion(x, y, color, count = 15, big = false) {
        const palette = [color, '#ffffff', '#ffaa00', '#ff00ff', '#00ffff'];
        for (let i = 0; i < count; i++) {
            const c = palette[Math.floor(Math.random() * palette.length)];
            const speed = Math.random() * (big ? 8 : 5) + 2;
            const life = Math.random() * (big ? 40 : 25) + 15;
            const type = Math.random() > 0.7 ? 'spark' : 'normal';
            this.particles.push(new Particle(x, y, c, speed, life, null, type));
        }
        if (big) {
            // Shockwave
            this.particles.push(new Particle(x, y, color, 0, 30, 20, 'shock'));
        }
    }

    checkCollision(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    spawnEngineParticles() {
        if (!this.player) return;
        const x = this.player.x + (Math.random() - 0.5) * 16;
        const y = this.player.y + this.player.height / 2;
        const color = Math.random() > 0.5 ? '#00aaff' : '#00ffff';
        this.particles.push(new Particle(x, y, color, 1.5, 10, 2));
    }

    // ============================================
    // UPDATE - ระบบหลัก
    // ============================================
    update() {
        const time = Date.now();
        this.starsBack.forEach(s => s.update(this.height));
        this.starsFront.forEach(s => s.update(this.height));
        this.nebulas.forEach(s => s.update(this.height));
        this.gridOffset = (this.gridOffset + 0.4) % 40;

        if (this.state === 'UPGRADE') return;
        if (this.state !== 'PLAYING') return;

        this.gameTime++;
        this.totalFrames++;
        this.gameTimer = Math.floor(this.totalFrames / 60); // วินาทีจริง

        // --- ตรวจสอบชัยชนะ (รอด 15 นาที) ---
        if (this.gameTimer >= this.gameDuration) {
            this.winGame();
            return;
        }

        // --- สปอว์นบอสทุก 5 นาที ---
        const bossMinutes = [5, 10, 15];
        for (let i = 0; i < 3; i++) {
            if (this.gameTimer >= bossMinutes[i] * 60 && !this.bossSpawned[i] && !this.bossDefeated[i]) {
                this.bossSpawned[i] = true;
                this.shake = Math.max(this.shake, 26);
                this.boss = new Boss(i + 1, this.width);
                this.audio.playBossAlert();
                this.audio.changeMusic(i === 0 ? 'boss1' : i === 1 ? 'boss2' : 'final');
                this.warningTimer = 180; // 3 วินาทีแสดงเตือน
                // ลบศัตรูทั้งหมดตอนบอสมา
                this.enemies = [];
            }
        }

        // --- ความยากเพิ่มตามเวลา ---
        const minuteLevel = Math.floor(this.gameTimer / 45);
        const timeRatio = this.gameTimer / this.gameDuration;
        this.difficulty = 0.55 + minuteLevel * 0.22 + timeRatio * 0.55;
        this.spawnInterval = Math.max(48, 110 - minuteLevel * 8 - timeRatio * 20);
        if (minuteLevel !== this.lastMinuteLevel) {
            this.lastMinuteLevel = minuteLevel;
            this.spawnTimer = 0;
        }

        // --- อัพเดตผู้เล่น ---
        this.player.update(this.input, this.width, this.height);
        if (this.gameTime % 2 === 0) this.spawnEngineParticles();

        // --- ยิงกระสุน ---
        if (this.input.shoot && this.player.canShoot()) {
            const newBullets = this.player.shoot();
            this.bullets.push(...newBullets);
            this.audio.playShoot();
        }

        // --- อัพเดตกระสุน ---
        this.bullets = this.bullets.filter(b => { b.update(); return b.active; });

        // --- อัพเดตไอเท็ม ---
        this.items = this.items.filter(item => { item.update(); return item.active; });
        for (let item of this.items) {
            if (this.checkCollision(item.getBounds(), this.player.getBounds())) {
                item.active = false;
                this.applyItemPickup(item);
            }
        }

        // --- สปอว์นศัตรู (ไม่สปอว์นตอนบอสอยู่ ยกเว้นบอสด่าน 3) ---
        if (!this.boss || this.boss.tier === 3) {
            this.spawnTimer++;
            if (this.spawnTimer >= this.spawnInterval) {
                const extra = Math.min(2, 1 + Math.floor(this.gameTimer / 90));
                for (let i = 0; i < extra; i++) this.spawnEnemy();
                this.spawnTimer = 0;
            }
        }

        // --- อัพเดตบอส ---
        if (this.boss && this.boss.active) {
            this.boss.update(this.player.x, this.player.y, this.gameTime);

            // บอสยิงกระสุน
            if (this.boss.phase === 'idle' && this.boss.shootTimer++ > 40) {
                this.boss.shootTimer = 0;
                const bossBullets = this.boss.getBossBullets();
                this.bullets.push(...bossBullets);
            }

            // ตรวจชนกระสุนกับบอส
            for (let b of this.bullets) {
                if (!b.active || b.isEnemy) continue;
                if (this.checkCollision(this.boss.getBounds(), b.getBounds())) {
                    b.active = false;
                    this.createExplosion(b.x, b.y, '#ff4444', 4);
                    if (this.boss.takeDamage(b.damage)) {
                        // บอสตาย
                        this.score += this.boss.score;
                        this.player.gainXp(this.boss.xpValue);
                        this.bossDefeated[this.boss.tier - 1] = true;
                        this.shake = 20;
                        this.createExplosion(this.boss.x, this.boss.y, this.boss.color, 60, true);
                        this.audio.playExplosion(3);
                        this.boss = null;
                        this.audio.changeMusic('normal');
                        break;
                    }
                    this.audio.playHit();
                }
            }

            // ตรวจชนบอสกับผู้เล่น
            if (this.boss && this.checkCollision(this.boss.getBounds(), this.player.getBounds())) {
                if (this.player.takeDamage(30)) {
                    this.shake = 15;
                    this.audio.playHit();
                }
                if (this.player.hp <= 0) this.gameOver();
            }
        }

        // --- อัพเดตศัตรู ---
        this.enemies = this.enemies.filter(enemy => {
            enemy.update(this.player.x, this.player.y, this.gameTime);

            // ชนกับผู้เล่น
            if (this.checkCollision(enemy.getBounds(), this.player.getBounds())) {
                if (this.player.takeDamage(enemy.type === 'bomber' ? 30 : 20)) {
                    this.shake = Math.max(this.shake, 18);
                    this.createExplosion(enemy.x, enemy.y, enemy.color, 12);
                    this.audio.playHit();
                }
                if (this.player.hp <= 0) this.gameOver();
                return false;
            }

            // ศัตรู elite ยิงกลับ
            if (enemy.canShoot()) {
                enemy.resetShoot();
                const angle = Math.atan2(this.player.y - enemy.y, this.player.x - enemy.x);
                this.bullets.push(new Bullet(
                    enemy.x, enemy.y + enemy.height / 2,
                    Math.sin(angle) * 5, '#ff3366',
                    { vx: Math.cos(angle) * 5, isEnemy: true, damage: 1 }
                ));
            }

            // ชนกับกระสุน
            for (let b of this.bullets) {
                if (!b.active || b.isEnemy) continue;
                if (b.alreadyHit.has(enemy.id)) continue;
                if (this.checkCollision(enemy.getBounds(), b.getBounds())) {
                    b.alreadyHit.add(enemy.id);
                    this.createExplosion(b.x, b.y, '#ffffff', 3);
                    if (enemy.takeDamage(b.damage)) {
                        this.score += enemy.score;
                        if (this.player.vampireRate > 0) {
                            this.player.hp = Math.min(this.player.maxHp, this.player.hp + this.player.vampireRate);
                        }
                        const leveledUp = this.player.gainXp(enemy.xpValue);
                        if (leveledUp) this.pendingLevelUp = true;
                        this.shake = enemy.type === 'destroyer' || enemy.type === 'bomber' ? 10 : 5;
                        this.createExplosion(enemy.x, enemy.y, enemy.color, enemy.type === 'destroyer' || enemy.type === 'bomber' ? 25 : 12, enemy.type === 'bomber');
                        this.audio.playExplosion(enemy.type === 'destroyer' ? 2 : 1);
                        // ไม่มีดรอปจากศัตรูปกติอีกต่อไป; ไอเท็มจะมาจาก spawn ทุก ๆ 30 วินาที
                        // if (Math.random() < 0.22) {
                        //     const drops = ['heal', 'shield', 'invul'];
                        //     const idx = Math.floor(Math.random() * drops.length);
                        //     this.items.push(new Item(enemy.x, enemy.y, drops[idx]));
                        // }
                        return false;
                    }
                    if (b.pierceLeft <= 0) b.active = false;
                    else b.pierceLeft--;
                    break;
                }
            }
            return enemy.active;
        });

        // กระสุนศัตรูโดนผู้เล่น
        for (let b of this.bullets) {
            if (!b.active || !b.isEnemy) continue;
            if (this.checkCollision(b.getBounds(), this.player.getBounds())) {
                b.active = false;
                if (this.player.takeDamage(15)) {
                    this.shake = Math.max(this.shake, 16);
                    this.audio.playHit();
                }
                if (this.player.hp <= 0) this.gameOver();
            }
        }

        // ไอเท็มปรากฏทุก 30 วินาที
        this.itemDropTimer++;
        if (this.itemDropTimer >= 900) {
            this.spawnRandomItem();
            this.itemDropTimer = 0;
        }

        // เลเวลอัพ
        if (this.pendingLevelUp && this.state === 'PLAYING') {
            this.state = 'UPGRADE';
            this.generateUpgradeOptions();
            this.audio.playLevelUp();
        }

        // อัพเดตอนุภาค
        this.particles = this.particles.filter(p => { p.update(); return !p.isDead; });

        // ลดแรงสั่น
        if (this.shake > 0) { this.shake *= 0.9; if (this.shake < 0.5) this.shake = 0; }
        if (this.warningTimer > 0) this.warningTimer--;
    }

    // ============================================
    // DRAW - วาดทั้งหมด
    // ============================================
    draw() {
        const time = Date.now();
        // พื้นหลัง gradient
        const grad = this.ctx.createLinearGradient(0, 0, 0, this.height);
        grad.addColorStop(0, '#000011');
        grad.addColorStop(0.5, '#0a0a1e');
        grad.addColorStop(1, '#050510');
        this.ctx.fillStyle = grad;
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.save();
        if (this.shake > 0) {
            this.ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
        }

        // Dynamic cosmic backdrop
        if (this.state !== 'MENU') this.drawCosmicBackdrop(time);
        this.nebulas.forEach(s => s.draw(this.ctx, time));
        this.drawGrid();
        this.starsBack.forEach(s => s.draw(this.ctx, time));
        this.starsFront.forEach(s => s.draw(this.ctx, time));

        if (this.state === 'MENU') { this.drawMenu(time); this.ctx.restore(); return; }

        this.items.forEach(item => item.draw(this.ctx));
        this.bullets.forEach(b => b.draw(this.ctx));
        this.enemies.forEach(e => e.draw(this.ctx));
        if (this.boss) this.boss.draw(this.ctx);
        if (this.player) this.player.draw(this.ctx);
        this.particles.forEach(p => p.draw(this.ctx));
        this.drawHUD();
        if (this.boss && this.boss.phase !== 'dead') this.drawBossBar();
        this.ctx.restore();

        // แจ้งเตือนบอส (ทับทุกอย่าง)
        if (this.warningTimer > 0) this.drawBossWarning();

        if (this.state === 'UPGRADE') this.drawUpgradeScreen(time);
        if (this.state === 'GAMEOVER') this.drawGameOver(time);
        if (this.state === 'VICTORY') this.drawVictory(time);
    }

    drawCosmicBackdrop(time) {
        const minuteLevel = Math.floor(this.gameTimer / 60);
        if (minuteLevel >= 10) {
            const holeX = this.width * 0.5;
            const holeY = this.height * 0.35;
            const holeSize = 180 + Math.sin(time / 250) * 12;
            const hole = this.ctx.createRadialGradient(holeX, holeY, 0, holeX, holeY, holeSize);
            hole.addColorStop(0, 'rgba(0,0,0,0)');
            hole.addColorStop(0.55, 'rgba(0, 0, 10, 0.4)');
            hole.addColorStop(1, 'rgba(0, 0, 0, 1)');
            this.ctx.fillStyle = hole;
            this.ctx.fillRect(holeX - holeSize, holeY - holeSize, holeSize * 2, holeSize * 2);

            for (let i = 0; i < 10; i++) {
                const angle = time / 400 + i * 0.6;
                const radius = holeSize + 50 + i * 8;
                this.ctx.strokeStyle = `rgba(160, 210, 255, ${0.08 - i * 0.005})`;
                this.ctx.lineWidth = 1.2;
                this.ctx.beginPath();
                this.ctx.arc(holeX, holeY, radius, angle, angle + Math.PI * 1.2);
                this.ctx.stroke();
            }

            for (let i = 0; i < 30; i++) {
                const sx = holeX + (Math.random() - 0.5) * 1400;
                const sy = holeY + (Math.random() - 0.5) * 260;
                const r = Math.random() * 2.5 + 0.5;
                const alpha = Math.max(0, 0.15 - Math.abs((sy - holeY) / 180) * 0.07);
                this.ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                this.ctx.beginPath();
                this.ctx.arc(sx, sy, r, 0, Math.PI * 2);
                this.ctx.fill();
            }
        } else if (minuteLevel >= 5) {
            const galaxyX = this.width * 0.6;
            const galaxyY = this.height * 0.3;
            const galaxy = this.ctx.createRadialGradient(galaxyX, galaxyY, 0, galaxyX, galaxyY, 230);
            galaxy.addColorStop(0, 'rgba(255, 140, 240, 0.24)');
            galaxy.addColorStop(0.35, 'rgba(80, 160, 255, 0.16)');
            galaxy.addColorStop(1, 'transparent');
            this.ctx.fillStyle = galaxy;
            this.ctx.fillRect(galaxyX - 260, galaxyY - 260, 520, 520);

            this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            for (let ring = 0; ring < 5; ring++) {
                const radius = 80 + ring * 30;
                this.ctx.beginPath();
                this.ctx.arc(galaxyX, galaxyY, radius, time / 500 + ring * 0.4, time / 500 + ring * 0.4 + Math.PI * 1.8);
                this.ctx.stroke();
            }
        } else if (minuteLevel >= 2) {
            const flareX = this.width * 0.25;
            const flareY = this.height * 0.2;
            const flare = this.ctx.createRadialGradient(flareX, flareY, 0, flareX, flareY, 180);
            flare.addColorStop(0, 'rgba(0, 255, 200, 0.18)');
            flare.addColorStop(0.45, 'rgba(0, 120, 255, 0.08)');
            flare.addColorStop(1, 'transparent');
            this.ctx.fillStyle = flare;
            this.ctx.fillRect(flareX - 200, flareY - 200, 400, 400);
        }
    }

    drawGrid() {
        this.ctx.strokeStyle = 'rgba(0, 200, 255, 0.03)';
        this.ctx.lineWidth = 1;
        for (let x = 0; x < this.width; x += 50) {
            this.ctx.beginPath(); this.ctx.moveTo(x, 0); this.ctx.lineTo(x, this.height); this.ctx.stroke();
        }
        for (let y = this.gridOffset; y < this.height; y += 50) {
            this.ctx.beginPath(); this.ctx.moveTo(0, y); this.ctx.lineTo(this.width, y); this.ctx.stroke();
        }
    }

    drawHUD() {
        // คะแนน
        this.ctx.textAlign = 'left';
        this.ctx.fillStyle = '#00e5ff'; this.ctx.shadowBlur = 12; this.ctx.shadowColor = '#00e5ff';
        this.ctx.font = 'bold 24px "Courier New", monospace';
        this.ctx.fillText(`SCORE: ${this.score}`, 20, 38); this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#ffaa00'; this.ctx.font = '14px "Courier New", monospace';
        this.ctx.fillText(`HI: ${this.highScore}`, 20, 58);

        // เลเวล + XP
        this.ctx.fillStyle = '#ffdd00'; this.ctx.font = 'bold 18px "Courier New", monospace';
        this.ctx.fillText(`Lv.${this.player.level}`, 20, 82);
        const xpBarW = 180, xpBarH = 10, xpBarX = 20, xpBarY = 90;
        const xpPct = this.player.xp / this.player.xpToNext;
        this.ctx.fillStyle = 'rgba(255,255,255,0.08)';
        this.ctx.fillRect(xpBarX, xpBarY, xpBarW, xpBarH);
        this.ctx.fillStyle = '#ffdd00'; this.ctx.shadowBlur = 8; this.ctx.shadowColor = '#ffdd00';
        this.ctx.fillRect(xpBarX, xpBarY, xpBarW * xpPct, xpBarH); this.ctx.shadowBlur = 0;
        this.ctx.strokeStyle = 'rgba(255,255,255,0.2)'; this.ctx.lineWidth = 1;
        this.ctx.strokeRect(xpBarX, xpBarY, xpBarW, xpBarH);

        // เวลา (นับถอยหลัง 15 นาที)
        const remaining = Math.max(0, this.gameDuration - this.gameTimer);
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
        this.ctx.textAlign = 'center';
        this.ctx.fillStyle = remaining < 60 ? '#ff3333' : '#ffffff';
        this.ctx.font = 'bold 20px "Courier New", monospace';
        this.ctx.fillText(`⏱️ ${timeStr}`, this.width / 2, 35);

        // HP Hearts
        this.ctx.textAlign = 'right';
        const heartX = this.width - 20;
        const heartY = 35;
        const heartSize = 16;
        const totalHeartSlots = Math.max(5, Math.ceil(this.player.maxHp / 20));
        for (let i = 0; i < totalHeartSlots; i++) {
            const heartLeft = heartX - i * (heartSize + 8);
            const segment = this.player.maxHp / totalHeartSlots;
            const filled = this.player.hp / segment >= (i + 1) ? 1 : this.player.hp / segment > i ? (this.player.hp / segment - i) : 0;
            this.ctx.fillStyle = filled > 0 ? '#ff3355' : 'rgba(255,255,255,0.15)';
            this.ctx.beginPath();
            this.ctx.moveTo(heartLeft - heartSize * 0.5, heartY + heartSize * 0.2);
            this.ctx.quadraticCurveTo(heartLeft - heartSize * 0.75, heartY - heartSize * 0.35, heartLeft - heartSize * 0.5, heartY - heartSize * 0.15);
            this.ctx.quadraticCurveTo(heartLeft - heartSize * 0.25, heartY - heartSize * 0.75, heartLeft, heartY - heartSize * 0.2);
            this.ctx.quadraticCurveTo(heartLeft + heartSize * 0.25, heartY - heartSize * 0.75, heartLeft + heartSize * 0.5, heartY - heartSize * 0.15);
            this.ctx.quadraticCurveTo(heartLeft + heartSize * 0.75, heartY - heartSize * 0.35, heartLeft + heartSize * 0.5, heartY + heartSize * 0.2);
            this.ctx.quadraticCurveTo(heartLeft, heartY + heartSize * 0.9, heartLeft - heartSize * 0.5, heartY + heartSize * 0.2);
            this.ctx.fill();
            if (filled > 0 && filled < 1) {
                this.ctx.fillStyle = 'rgba(0,0,0,0.25)';
                this.ctx.fillRect(heartLeft - heartSize * 0.4, heartY - heartSize * 0.2, heartSize * 0.8 * filled, heartSize * 0.8);
            }
        }

        // เกราะ
        if (this.player.shieldMax > 0) {
            this.ctx.fillStyle = '#00ccff'; this.ctx.font = 'bold 14px "Courier New", monospace';
            this.ctx.textAlign = 'right';
            this.ctx.fillText(`🛡️ ${this.player.shield}/${this.player.shieldMax}`, this.width - 20, 58);
        }

        // พลังแฝงด้านล่าง
        this.ctx.textAlign = 'left';
        let px = 20; const py = this.height - 28;
        for (const p of this.player.powers.values()) {
            p.drawIcon(this.ctx, px + 12, py - 6, 20);
            this.ctx.fillStyle = '#ffffff'; this.ctx.font = 'bold 13px "Segoe UI", sans-serif';
            this.ctx.fillText(`${p.name} Lv.${p.level}`, px + 36, py);
            px += 150;
        }

        // ความยาก
        this.ctx.fillStyle = 'rgba(255,255,255,0.3)'; this.ctx.font = '12px monospace';
        this.ctx.textAlign = 'right';
        this.ctx.fillText(`DIFF x${this.difficulty.toFixed(1)}`, this.width - 20, this.height - 10);
    }

    drawBossBar() {
        if (!this.boss || this.boss.phase === 'enter' || this.boss.phase === 'dead') return;
        const barW = 500, barH = 22;
        const barX = (this.width - barW) / 2;
        const barY = 55;
        const hpPct = this.boss.hp / this.boss.maxHp;

        // ชื่อบอส
        this.ctx.textAlign = 'center';
        this.ctx.fillStyle = '#ff4444';
        this.ctx.font = 'bold 16px "Courier New", monospace';
        this.ctx.fillText(`⚠ BOSS TIER ${this.boss.tier} ⚠`, this.width / 2, barY - 8);

        // พื้นหลัง
        this.ctx.fillStyle = 'rgba(0,0,0,0.6)';
        this.ctx.fillRect(barX - 4, barY - 4, barW + 8, barH + 8);
        this.ctx.fillStyle = 'rgba(255,50,50,0.15)';
        this.ctx.fillRect(barX, barY, barW, barH);

        // หลอดเลือด
        this.ctx.fillStyle = '#ff2222';
        this.ctx.shadowBlur = 20; this.ctx.shadowColor = '#ff0000';
        this.ctx.fillRect(barX, barY, barW * hpPct, barH);
        this.ctx.shadowBlur = 0;

        // ขอบ
        this.ctx.strokeStyle = '#ff6666';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(barX, barY, barW, barH);

        // ตัวเลข HP
        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 13px "Segoe UI", sans-serif';
        this.ctx.fillText(`${this.boss.hp} / ${this.boss.maxHp}`, this.width / 2, barY + 16);
    }

    drawBossWarning() {
        const alpha = Math.min(1, this.warningTimer / 60);
        this.ctx.fillStyle = `rgba(255, 0, 0, ${alpha * 0.3})`;
        this.ctx.fillRect(0, 0, this.width, this.height);
        this.ctx.textAlign = 'center';
        this.ctx.fillStyle = `rgba(255, 50, 50, ${alpha})`;
        this.ctx.shadowBlur = 30; this.ctx.shadowColor = '#ff0000';
        this.ctx.font = 'bold 56px "Courier New", monospace';
        this.ctx.fillText('⚠ WARNING ⚠', this.width / 2, this.height / 2 - 20);
        this.ctx.font = 'bold 32px "Courier New", monospace';
        this.ctx.fillText(`BOSS APPROACHING - TIER ${this.boss ? this.boss.tier : 1}`, this.width / 2, this.height / 2 + 30);
        this.ctx.shadowBlur = 0;
    }

    drawUpgradeScreen(time) {
        this.ctx.fillStyle = 'rgba(0, 0, 8, 0.9)';
        this.ctx.fillRect(0, 0, this.width, this.height);
        this.ctx.textAlign = 'center';
        this.ctx.fillStyle = '#ffdd00'; this.ctx.shadowBlur = 35; this.ctx.shadowColor = '#ffdd00';
        this.ctx.font = 'bold 52px "Courier New", monospace';
        this.ctx.fillText('LEVEL UP!', this.width / 2, 130); this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#ffffff'; this.ctx.font = '20px "Segoe UI", sans-serif';
        this.ctx.fillText(`เลเวล ${this.player.level} - เลือกพลังแฝง (◄ ► + SPACE)`, this.width / 2, 175);

        const cardW = 260, cardH = 340, gap = 30;
        const startX = (this.width - (cardW * 3 + gap * 2)) / 2;
        const cardY = 210;
        for (let i = 0; i < 3; i++) {
            const opt = this.upgradeOptions[i];
            if (!opt) continue;
            const p = opt.power;
            const x = startX + i * (cardW + gap);
            const isSelected = i === this.upgradeSelection;
            this.ctx.fillStyle = isSelected ? 'rgba(0, 30, 50, 0.95)' : 'rgba(8, 8, 20, 0.92)';
            this.ctx.strokeStyle = isSelected ? p.color : 'rgba(255,255,255,0.15)';
            this.ctx.lineWidth = isSelected ? 4 : 2;
            this.ctx.shadowBlur = isSelected ? 30 : 0; this.ctx.shadowColor = p.color;
            this.drawRoundRect(x, cardY, cardW, cardH, 14);
            this.ctx.fill(); this.ctx.stroke(); this.ctx.shadowBlur = 0;

            this.ctx.fillStyle = p.color; this.ctx.font = 'bold 72px "Segoe UI", sans-serif';
            this.ctx.textAlign = 'center';
            p.drawIcon(this.ctx, x + cardW / 2, cardY + 90, 42);
            this.ctx.fillStyle = '#ffffff'; this.ctx.font = 'bold 24px "Segoe UI", sans-serif';
            this.ctx.fillText(p.name, x + cardW / 2, cardY + 150);
            if (opt.isNew && p.level === 0) {
                this.ctx.fillStyle = '#00ff66'; this.ctx.font = 'bold 15px "Segoe UI", sans-serif';
                this.ctx.fillText('[ พลังใหม่ ]', x + cardW / 2, cardY + 180);
            } else {
                this.ctx.fillStyle = '#ffaa33'; this.ctx.font = 'bold 15px "Segoe UI", sans-serif';
                this.ctx.fillText(`[ อัพเกรด Lv.${p.level} → Lv.${p.level + 1} ]`, x + cardW / 2, cardY + 180);
            }
            this.ctx.fillStyle = '#aabbcc'; this.ctx.font = '16px "Segoe UI", sans-serif';
            this.wrapText(p.getLevelDescription(), x + cardW / 2, cardY + 220, cardW - 40, 24);

            const dotY = cardY + cardH - 45, dotR = 7, dotGap = 20;
            const totalW = (p.maxLevel - 1) * dotGap;
            const dotStartX = x + (cardW - totalW) / 2;
            for (let lv = 1; lv <= p.maxLevel; lv++) {
                const dotX = dotStartX + (lv - 1) * dotGap;
                this.ctx.beginPath(); this.ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
                if (lv <= p.level) { this.ctx.fillStyle = p.color; this.ctx.shadowBlur = 8; this.ctx.shadowColor = p.color; }
                else if (lv === p.level + 1 && isSelected) { this.ctx.fillStyle = '#fff'; this.ctx.shadowBlur = 5; this.ctx.shadowColor = '#fff'; }
                else { this.ctx.fillStyle = 'rgba(255,255,255,0.12)'; this.ctx.shadowBlur = 0; }
                this.ctx.fill(); this.ctx.shadowBlur = 0;
            }
            if (isSelected) {
                this.ctx.fillStyle = '#ffffff'; this.ctx.font = 'bold 17px "Segoe UI", sans-serif';
                if (Math.sin(time / 180) > 0) this.ctx.fillText('▲ กด SPACE เพื่อเลือก ▲', x + cardW / 2, cardY + cardH - 15);
            }
        }
    }

    drawRoundRect(x, y, w, h, r) {
        this.ctx.beginPath();
        this.ctx.moveTo(x + r, y);
        this.ctx.lineTo(x + w - r, y);
        this.ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        this.ctx.lineTo(x + w, y + h - r);
        this.ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.ctx.lineTo(x + r, y + h);
        this.ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        this.ctx.lineTo(x, y + r);
        this.ctx.quadraticCurveTo(x, y, x + r, y);
        this.ctx.closePath();
    }

    wrapText(text, x, y, maxWidth, lineHeight) {
        this.ctx.textAlign = 'center';
        const words = text.split(' ');
        let line = '', lineY = y;
        for (let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = this.ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                this.ctx.fillText(line, x, lineY);
                line = words[n] + ' '; lineY += lineHeight;
            } else { line = testLine; }
        }
        this.ctx.fillText(line, x, lineY);
    }

    drawMenu(time) {
        // Dynamic neon cosmos background
        const inner = this.ctx.createRadialGradient(this.width / 2, this.height * 0.25, 20, this.width / 2, this.height * 0.25, this.width * 0.9);
        inner.addColorStop(0, '#0ffdff');
        inner.addColorStop(0.12, 'rgba(0, 255, 255, 0.12)');
        inner.addColorStop(0.25, 'rgba(10, 10, 35, 0.3)');
        inner.addColorStop(1, '#02020b');
        this.ctx.fillStyle = inner;
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Pulsing gases and galaxy core
        const pulse = Math.sin(time / 800) * 0.5 + 0.5;
        const core = this.ctx.createRadialGradient(this.width / 2, this.height * 0.28, 10, this.width / 2, this.height * 0.28, 220);
        core.addColorStop(0, `rgba(255, 110, 240, ${0.35 + pulse * 0.2})`);
        core.addColorStop(0.35, 'rgba(0, 200, 255, 0.18)');
        core.addColorStop(0.7, 'transparent');
        this.ctx.fillStyle = core;
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Background starfield accent
        this.starsBack.forEach(s => s.draw(this.ctx, time));
        this.nebulas.forEach(s => s.draw(this.ctx, time));

        this.ctx.textAlign = 'center';
        this.ctx.shadowBlur = 40;
        this.ctx.fillStyle = '#00fae0';
        this.ctx.shadowColor = '#00fae0';
        this.ctx.font = 'bold 76px "Courier New", monospace';
        this.ctx.fillText('NEON SPACE', this.width / 2, this.height / 2 - 80);

        this.ctx.fillStyle = '#ff55ff';
        this.ctx.shadowColor = '#ff55ff';
        this.ctx.font = 'bold 62px "Courier New", monospace';
        this.ctx.fillText('SHOOTER', this.width / 2, this.height / 2 + 20);
        this.ctx.shadowBlur = 0;

        this.ctx.fillStyle = '#ffcc33';
        this.ctx.font = 'bold 18px "Segoe UI", sans-serif';
        this.ctx.fillText('PRESS SPACE / TAP TO START', this.width / 2, this.height / 2 + 70);
    }

    drawGameOver(time) {
        this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        this.ctx.fillRect(0, 0, this.width, this.height);
        this.ctx.textAlign = 'center'; this.ctx.shadowBlur = 30;
        this.ctx.fillStyle = '#ff3366'; this.ctx.shadowColor = '#ff3366';
        this.ctx.font = 'bold 76px "Courier New", monospace';
        this.ctx.fillText('GAME OVER', this.width / 2, this.height / 2 - 50); this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#ffffff'; this.ctx.font = '26px "Segoe UI", sans-serif';
        this.ctx.fillText(`คะแนน: ${this.score}  |  เลเวล: ${this.player ? this.player.level : 1}  |  เวลา: ${this.gameTimer}s`, this.width / 2, this.height / 2 + 15);
        const isNewHigh = this.score >= this.highScore && this.score > 0;
        this.ctx.fillStyle = isNewHigh ? '#ffdd00' : '#8899aa'; this.ctx.font = '22px "Segoe UI", sans-serif';
        this.ctx.fillText(isNewHigh ? `🏆 สถิติใหม่: ${this.highScore} 🏆` : `สูงสุด: ${this.highScore}`, this.width / 2, this.height / 2 + 55);
        this.ctx.fillStyle = '#00ffff'; this.ctx.font = '20px "Segoe UI", sans-serif';
        if (Math.sin(time / 250) > 0) this.ctx.fillText('กด [ SPACEBAR ] หรือแตะหน้าจอเพื่อเล่นใหม่', this.width / 2, this.height / 2 + 115);
    }

    drawVictory(time) {
        this.ctx.fillStyle = 'rgba(0, 10, 30, 0.6)';
        this.ctx.fillRect(0, 0, this.width, this.height);
        this.ctx.textAlign = 'center'; this.ctx.shadowBlur = 40;
        this.ctx.fillStyle = '#ffdd00'; this.ctx.shadowColor = '#ffdd00';
        this.ctx.font = 'bold 72px "Courier New", monospace';
        this.ctx.fillText('VICTORY!', this.width / 2, this.height / 2 - 60); this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#00ff88'; this.ctx.font = '28px "Segoe UI", sans-serif';
        this.ctx.fillText('คุณเอาชีวิตรอดครบ 15 นาที!', this.width / 2, this.height / 2 + 5);
        this.ctx.fillStyle = '#ffffff'; this.ctx.font = '24px "Segoe UI", sans-serif';
        this.ctx.fillText(`คะแนน: ${this.score}  |  เลเวลสูงสุด: ${this.player ? this.player.level : 1}`, this.width / 2, this.height / 2 + 45);
        const isNewHigh = this.score >= this.highScore && this.score > 0;
        this.ctx.fillStyle = isNewHigh ? '#ffdd00' : '#8899aa'; this.ctx.font = '22px "Segoe UI", sans-serif';
        this.ctx.fillText(isNewHigh ? `🏆 สถิติใหม่: ${this.highScore} 🏆` : `สูงสุด: ${this.highScore}`, this.width / 2, this.height / 2 + 85);
        this.ctx.fillStyle = '#00ffff'; this.ctx.font = '20px "Segoe UI", sans-serif';
        if (Math.sin(time / 250) > 0) this.ctx.fillText('กด [ SPACEBAR ] หรือแตะหน้าจอเพื่อเล่นใหม่', this.width / 2, this.height / 2 + 145);
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(this.loop);
    }
}

window.onload = () => { new Game(); };
    </script>
</body>
