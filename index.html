<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Shooter - Final Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;

            font-family: 'Segoe UI', 'Courier New', monospace;

        }
        #game-container {
            position: relative;
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.25), 0 0 120px rgba(0, 100, 255, 0.1);

            display: flex;

        .touch-button.up { left: 70px; bottom: 138px; }
        .touch-button.down { left: 70px; bottom: 44px; }
        .touch-button.left { left: 12px; bottom: 90px; }
        .touch-button.right { left: 128px; bottom: 90px; }
        .touch-button.shoot { right: 30px; bottom: 70px; width: 96px; height: 96px; border-radius: 50%; background: rgba(255, 90, 90, 0.38); }
        @media (max-width: 768px) {
            .touch-button { width: 62px; height: 62px; font-size: 16px; }
            .touch-button.up { left: 48px; bottom: 120px; }
            .touch-button.down { left: 48px; bottom: 30px; }
            .touch-button.left { left: 8px; bottom: 74px; }

<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="800"></canvas>
        <div class="touch-controls" aria-hidden="true">
            <div class="touch-button left" data-control="left">◀</div>
            <div class="touch-button right" data-control="right">▶</div>
            <div class="touch-button up" data-control="up">▲</div>
            <div class="touch-button down" data-control="down">▼</div>
            <div class="touch-button shoot" data-control="shoot">FIRE</div>
        </div>

    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ============================================================
// AUDIO MANAGER - Web Audio API Synthesizer
// สร้างเสียงสังเคราะห์แบบ Procedural ไม่ต้องใช้ไฟล์เสียง
// ============================================================
class AudioManager {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.bgmOscs = [];
        this.bgmInterval = null;
        this.bgmNoteIndex = 0;
        this.musicMode = 'normal';
        this.isPlaying = false;
        // สเกลเพลงแนว Cyberpunk
        this.bgmNotes = [55, 58, 60, 61, 64, 65, 70, 73, 77, 82, 85];
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.28;
            this.masterGain.connect(this.ctx.destination);
        }
    }

    // สร้างเสียงยิง (Laser)
    playShoot() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(760, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(260, this.ctx.currentTime + 0.16);
        filter.type = 'lowpass';
        filter.frequency.value = 1400;
        filter.Q.value = 1.2;
        gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.16);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.16);
    }

    // สร้างเสียงระเบิด (Explosion)
    playExplosion(size = 1) {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 0.3;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 800 * size;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.25 * size, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start();
    }

    // เสียงชน / โดนยิง
    playHit() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.14);
        filter.type = 'lowpass';
        filter.frequency.value = 900;
        filter.Q.value = 1;
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.14);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.14);
    }

    playPickup() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(660, this.ctx.currentTime + 0.08);
        filter.type = 'bandpass';
        filter.frequency.value = 900;
        filter.Q.value = 1.4;
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.16);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.16);
    }

    // เสียงเลเวลอัพ
    playLevelUp() {
        if (!this.ctx) return;
        const notes = [523, 659, 784, 1047];
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.1);
            gain.gain.linearRampToValueAtTime(0.18, this.ctx.currentTime + i * 0.1 + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.1 + 0.35);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(this.ctx.currentTime + i * 0.1);
            osc.stop(this.ctx.currentTime + i * 0.1 + 0.35);
        });
    }

    // เสียงบอสปรากฏตัว
    playBossAlert() {
        if (!this.ctx) return;
        for (let i = 0; i < 3; i++) {
            const osc = this.ctx.createOscillator();
            const filter = this.ctx.createBiquadFilter();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, this.ctx.currentTime + i * 0.4);
            osc.frequency.linearRampToValueAtTime(70, this.ctx.currentTime + i * 0.4 + 0.3);
            filter.type = 'lowpass';
            filter.frequency.value = 700;
            filter.Q.value = 1.3;
            gain.gain.setValueAtTime(0.24, this.ctx.currentTime + i * 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.4 + 0.5);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);
            osc.start(this.ctx.currentTime + i * 0.4);
            osc.stop(this.ctx.currentTime + i * 0.4 + 0.5);
        }
    }

    // เสียงชนะเกม
    playWin() {
        if (!this.ctx) return;
        const scale = [523, 587, 659, 784, 880, 1047, 1175, 1319];
        scale.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, this.ctx.currentTime + i * 0.12);
            gain.gain.linearRampToValueAtTime(0.16, this.ctx.currentTime + i * 0.12 + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.12 + 0.45);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(this.ctx.currentTime + i * 0.12);
            osc.stop(this.ctx.currentTime + i * 0.12 + 0.45);
        });
    }

    // BGM - Cyberpunk และบอสเธม
    startBGM(mode = 'normal') {
        if (!this.ctx) return;
        if (this.isPlaying && this.musicMode === mode) return;
        this._stopBGM();
        this.musicMode = mode;
        this.isPlaying = true;
        this.bgmNoteIndex = 0;

        const settings = {
            menu: { bassType: 'triangle', bassFreq: 28, bassGain: 0.045, bassFilter: 140, padFreq: 48, padGain: 0.018, leadType: 'triangle', leadFreq: 100, leadGain: 0.03, leadFilter: 880, interval: 170, noteSet: [55, 58, 60, 61, 64, 68, 72] },
            normal: { bassType: 'triangle', bassFreq: 32.5, bassGain: 0.06, bassFilter: 120, padFreq: 52, padGain: 0.02, leadType: 'triangle', leadFreq: 130, leadGain: 0.048, leadFilter: 900, interval: 140, noteSet: [55, 58, 60, 61, 64, 65, 70, 73] },
            boss1: { bassType: 'sawtooth', bassFreq: 28, bassGain: 0.075, bassFilter: 110, padFreq: 40, padGain: 0.025, leadType: 'square', leadFreq: 110, leadGain: 0.055, leadFilter: 760, interval: 115, noteSet: [48, 50, 53, 55, 58, 60] },
            boss2: { bassType: 'sawtooth', bassFreq: 24, bassGain: 0.085, bassFilter: 100, padFreq: 34, padGain: 0.028, leadType: 'sawtooth', leadFreq: 95, leadGain: 0.06, leadFilter: 700, interval: 95, noteSet: [42, 45, 47, 50, 53, 57] },
            final: { bassType: 'sawtooth', bassFreq: 20, bassGain: 0.095, bassFilter: 90, padFreq: 28, padGain: 0.03, leadType: 'triangle', leadFreq: 80, leadGain: 0.065, leadFilter: 620, interval: 180, noteSet: [33, 36, 38, 41, 44, 47, 50] }
        };

        const cfg = settings[mode] || settings.normal;
        const bassOsc = this.ctx.createOscillator();
        const bassGain = this.ctx.createGain();
        const bassFilter = this.ctx.createBiquadFilter();
        bassOsc.type = cfg.bassType;
        bassOsc.frequency.value = cfg.bassFreq;
        bassFilter.type = 'lowpass';
        bassFilter.frequency.value = cfg.bassFilter;
        bassFilter.Q.value = 0.75;
        bassGain.gain.value = cfg.bassGain * 0.6;
        bassOsc.connect(bassFilter);
        bassFilter.connect(bassGain);
        bassGain.connect(this.masterGain);
        bassOsc.start();

        const padOsc = this.ctx.createOscillator();
        const padGain = this.ctx.createGain();
        const padFilter = this.ctx.createBiquadFilter();
        padOsc.type = 'triangle';
        padOsc.frequency.value = cfg.padFreq || cfg.bassFreq * 1.8;
        padFilter.type = 'lowpass';
        padFilter.frequency.value = 180;
        padFilter.Q.value = 0.55;
        padOsc.connect(padFilter);
        padFilter.connect(padGain);
        padGain.gain.value = cfg.padGain || 0.009;
        padGain.connect(this.masterGain);
        padOsc.start();

        const leadOsc = this.ctx.createOscillator();
        const leadGain = this.ctx.createGain();
        const leadFilter = this.ctx.createBiquadFilter();
        leadOsc.type = 'triangle';
        leadOsc.frequency.value = cfg.leadFreq;
        leadFilter.type = 'lowpass';
        leadFilter.frequency.value = cfg.leadFilter;
        leadFilter.Q.value = 0.7;
        leadOsc.connect(leadFilter);
        leadFilter.connect(leadGain);
        leadGain.gain.value = cfg.leadGain * 0.35;
        leadGain.connect(this.masterGain);
        leadOsc.start();

        this.bgmOscs = [bassOsc, padOsc, leadOsc];

        const playMelodyNote = () => {
            const note = cfg.noteSet[this.bgmNoteIndex % cfg.noteSet.length];
            const osc = this.ctx.createOscillator();
            const filter = this.ctx.createBiquadFilter();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(note, this.ctx.currentTime);
            filter.type = 'lowpass';
            filter.frequency.value = note * 1.8;
            filter.Q.value = 0.55;
            gain.gain.setValueAtTime(0.032, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.0);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);
            osc.start();
            osc.stop(this.ctx.currentTime + 1.0);
            this.bgmNoteIndex++;
        };

        playMelodyNote();
        this.bgmInterval = setInterval(playMelodyNote, cfg.interval * 3);
    }

    changeMusic(mode) {
        if (mode === this.musicMode) return;
        this.startBGM(mode);
    }

    _stopBGM() {
        if (this.bgmOscs.length) {
            this.bgmOscs.forEach(osc => { try { osc.stop(); } catch (e) {} });
            this.bgmOscs = [];
        }
        if (this.bgmInterval) { clearInterval(this.bgmInterval); this.bgmInterval = null; }
        this.isPlaying = false;
    }

    stopBGM() {
        this._stopBGM();
    }
}

// ============================================
// Vector2
// ============================================
class Vector2 {
    constructor(x = 0, y = 0) { this.x = x; this.y = y; }
    add(v) { return new Vector2(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vector2(this.x - v.x, this.y - v.y); }
    mult(n) { return new Vector2(this.x * n, this.y * n); }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() { const m = this.mag(); return m === 0 ? new Vector2(0, 0) : new Vector2(this.x / m, this.y / m); }
}

// ============================================
// Particle System (อัพเกรดมี Shockwave)
// ============================================
class Particle {
    constructor(x, y, color, speed, life, size = null, type = 'normal') {
        this.x = x; this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * speed;
        this.vx = Math.cos(angle) * velocity;
        this.vy = Math.sin(angle) * velocity;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = size || Math.random() * 3 + 1;
        this.decay = Math.random() * 0.05 + 0.92;
        this.type = type;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vx *= 0.96; this.vy *= 0.96;
        this.life--;
        this.size *= this.decay;
        this.rotation += this.rotSpeed;
    }
    draw(ctx) {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.globalAlpha = alpha;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        if (this.type === 'shock') {
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 20;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(0, 0, this.size * 5, 0, Math.PI * 2);
            ctx.stroke();
        } else if (this.type === 'spark') {
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fillRect(-this.size / 2, -this.size * 3, this.size, this.size * 6);
        } else {
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(0, 0, Math.max(0.1, this.size), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
        ctx.globalAlpha = 1;
    }
    get isDead() { return this.life <= 0 || this.size < 0.1; }
}

// ============================================
// Starfield (Parallax + Nebula texture)
// ============================================
class Star {
    constructor(canvasWidth, canvasHeight, speedMultiplier = 1, isNebula = false) {
        this.canvasWidth = canvasWidth;
        this.x = Math.random() * canvasWidth;
        this.y = Math.random() * canvasHeight;
        this.isNebula = isNebula;
        if (isNebula) {
            this.size = Math.random() * 80 + 40;
            this.speed = 0.1;
            this.color = `hsla(${Math.random() * 60 + 180}, 70%, 30%, ${Math.random() * 0.08 + 0.02})`;
        } else {
            this.size = Math.random() * 2.5 + 0.3;
            this.speed = this.size * 0.6 * speedMultiplier;
            this.brightness = Math.random() * 0.5 + 0.3;
            this.twinkleSpeed = Math.random() * 0.05 + 0.01;
            this.twinkleOffset = Math.random() * Math.PI * 2;
        }
    }
    update(canvasHeight) {
        this.y += this.speed;
        if (this.y > canvasHeight + 100) {
            this.y = -100;
            this.x = Math.random() * this.canvasWidth;
        }
    }
    draw(ctx, time) {
        if (this.isNebula) {
            const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
            grad.addColorStop(0, this.color);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        } else {
            const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
            const alpha = this.brightness + twinkle * 0.15;
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, alpha)})`;
            ctx.shadowBlur = this.size > 1.5 ? 6 : 0;
            ctx.shadowColor = '#ffffff';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
}

// ============================================
// Bullet (อัพเกรดมี trail)
// ============================================
class Bullet {
    constructor(x, y, vy, color, options = {}) {
        this.x = x; this.y = y;
        this.vx = options.vx || 0;
        this.vy = vy;
        this.color = color;
        this.isEnemy = options.isEnemy || false;
        this.width = this.isEnemy ? 6 : 4;
        this.height = this.isEnemy ? 12 : 16;
        this.active = true;
        this.damage = options.damage || 1;
        this.pierceLeft = options.pierce || 0;
        this.alreadyHit = new Set();
        this.trail = [];
    }
    update() {
        this.trail.push({ x: this.x, y: this.y, life: 8 });
        if (this.trail.length > 8) this.trail.shift();
        this.trail.forEach(t => t.life--);
        this.trail = this.trail.filter(t => t.life > 0);
        this.x += this.vx;
        this.y += this.vy;
        if (this.y < -40 || this.y > canvas.height + 40 || this.x < -40 || this.x > canvas.width + 40) this.active = false;
    }
    draw(ctx) {
        // Trail
        this.trail.forEach((t, i) => {
            const alpha = (t.life / 8) * 0.4;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(t.x, t.y, this.width * 0.6 * (i / 8 + 0.3), 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        if (Math.abs(this.vx) > 0.1) {
            ctx.translate(this.x, this.y);
            ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI / 2);
            ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
        } else {
            ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
        }
        ctx.restore();
    }
    getBounds() {
        return { x: this.x - this.width / 2, y: this.y, w: this.width, h: this.height };
    }
}

// ============================================
// Enemy - เพิ่มประเภท: drone, bomber, elite, scout, interceptor, destroyer
// ============================================
class Enemy {
    constructor(x, y, type, id, minuteLevel = 0) {
        this.id = id;
        this.x = x; this.y = y;
        this.type = type;
        this.active = true;
        this.vx = 0; this.vy = 0;
        this.angle = 0;
        this.shootTimer = 0;
        this.phase = 0;
        switch (type) {
            case 'scout':
                this.hp = 1; this.maxHp = 1; this.speed = 1.7;
                this.color = '#ffdd00'; this.score = 100; this.xpValue = 15;
                this.width = 28; this.height = 28;
                break;
            case 'interceptor':
                this.hp = 3; this.maxHp = 3; this.speed = 1.2;
                this.color = '#ff3366'; this.score = 250; this.xpValue = 35;
                this.width = 36; this.height = 36;
                break;
            case 'destroyer':
                this.hp = 16; this.maxHp = 16; this.speed = 0.42;
                this.color = '#cc33ff'; this.score = 700; this.xpValue = 95;
                this.width = 56; this.height = 56;
                break;
            case 'drone':
                this.hp = 2; this.maxHp = 2; this.speed = 1.3;
                this.color = '#00ffaa'; this.score = 180; this.xpValue = 25;
                this.width = 24; this.height = 24;
                this.orbitAngle = Math.random() * Math.PI * 2;
                this.orbitCenterX = x;
                break;
            case 'striker':
                this.hp = 4; this.maxHp = 4; this.speed = 1.8;
                this.color = '#66ccff'; this.score = 220; this.xpValue = 30;
                this.width = 30; this.height = 30;
                this.shootInterval = 120;
                break;
            case 'bomber':
                this.hp = 22; this.maxHp = 22; this.speed = 0.3;
                this.color = '#ff6600'; this.score = 420; this.xpValue = 65;
                this.width = 48; this.height = 48;
                break;
            case 'warden':
                this.hp = 24; this.maxHp = 24; this.speed = 0.58;
                this.color = '#ff2299'; this.score = 900; this.xpValue = 120;
                this.width = 62; this.height = 62;
                this.shootInterval = 150;
                break;
            case 'elite':
                this.hp = 5; this.maxHp = 5; this.speed = 1.45;
                this.color = '#ff0066'; this.score = 350; this.xpValue = 50;
                this.width = 32; this.height = 32;
                this.shootInterval = 110;
                break;
        }
        const scale = 1 + Math.min(minuteLevel * 0.06, 0.4);
        this.hp = Math.max(1, Math.ceil(this.hp * scale));
        this.maxHp = this.hp;
        this.score = Math.ceil(this.score * (1 + minuteLevel * 0.07));
        this.xpValue = Math.ceil(this.xpValue * (1 + minuteLevel * 0.05));
    }

    update(playerX, playerY, time) {
        this.angle += 0.03;
        if (this.type === 'scout') {
            this.y += this.speed;
            const dir = playerX - this.x;
            this.vx += (dir > 0 ? 0.06 : -0.06);
            this.vx = Math.max(-3.5, Math.min(3.5, this.vx));
            this.x += this.vx;
        } else if (this.type === 'interceptor') {
            this.y += this.speed;
            this.x += Math.sin(time * 0.03 + this.y * 0.01) * 2.5;
        } else if (this.type === 'destroyer') {
            this.y += this.speed;
            this.x += Math.sin(time * 0.015) * 1.5;
        } else if (this.type === 'drone') {
            this.orbitAngle += 0.04;
            this.y += this.speed * 0.6;
            this.x = this.orbitCenterX + Math.sin(this.orbitAngle) * 60;
        } else if (this.type === 'bomber') {
            this.y += this.speed;
            this.x += Math.sin(time * 0.008) * 0.8;
        } else if (this.type === 'striker') {
            this.y += this.speed;
            const dx = playerX - this.x;
            this.x += Math.sign(dx) * Math.min(3.2, Math.abs(dx) * 0.02);
            this.shootTimer++;
        } else if (this.type === 'warden') {
            this.y += this.speed;
            this.x += Math.sin(time * 0.012) * 1.2;
            this.shootTimer++;
        } else if (this.type === 'elite') {
            this.y += this.speed;
            const dx = playerX - this.x;
            const dy = playerY - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 0) {
                this.x += (dx / dist) * 1.2;
                this.y += (dy / dist) * 0.8;
            }
            this.shootTimer++;
        }
        if (this.y > canvas.height + 80) this.active = false;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 18;
        ctx.shadowColor = this.color;

        if (this.type === 'scout') {
            ctx.rotate(this.angle * 0.7);
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.lineTo(this.width / 2, 0);
            ctx.lineTo(0, this.height / 2);
            ctx.lineTo(-this.width / 2, 0);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.beginPath();
            ctx.moveTo(0, -this.height * 0.28);
            ctx.lineTo(this.width * 0.18, 0);
            ctx.lineTo(0, this.height * 0.28);
            ctx.lineTo(-this.width * 0.18, 0);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.3; ctx.stroke();
        } else if (this.type === 'interceptor') {
            ctx.rotate(this.angle * 0.5);
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.lineTo(this.width / 2.2, -this.height / 7);
            ctx.lineTo(this.width / 2.6, this.height / 3);
            ctx.lineTo(0, this.height / 2);
            ctx.lineTo(-this.width / 2.6, this.height / 3);
            ctx.lineTo(-this.width / 2.2, -this.height / 7);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(-this.width / 8, -this.height / 4, this.width / 4, this.height / 2);
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(-this.width / 20, -this.height / 5, this.width / 10, this.height / 2.2);
        } else if (this.type === 'destroyer') {
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = (Math.PI / 4) * i - Math.PI / 2;
                const r = this.width / 2.1;
                const px = Math.cos(a) * r;
                const py = Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.stroke();
        } else if (this.type === 'drone') {
            ctx.rotate(this.angle);
            ctx.beginPath();
            ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#00ffaa'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-this.width, 0); ctx.lineTo(this.width, 0);
            ctx.moveTo(0, -this.width); ctx.lineTo(0, this.width);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(0, 0, this.width / 2 - 4, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.arc(0, 0, this.width / 6, 0, Math.PI * 2); ctx.fill();
        } else if (this.type === 'bomber') {
            ctx.fillStyle = '#ff4400';
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2.3);
            ctx.lineTo(this.width / 2.1, -this.height / 8);
            ctx.lineTo(this.width / 2.6, this.height / 2.1);
            ctx.lineTo(-this.width / 2.6, this.height / 2.1);
            ctx.lineTo(-this.width / 2.1, -this.height / 8);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#ff8800';
            ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.16)';
            ctx.beginPath(); ctx.moveTo(-this.width / 5, -4); ctx.lineTo(this.width / 5, -4); ctx.lineTo(this.width / 4, this.height / 5); ctx.lineTo(-this.width / 4, this.height / 5); ctx.closePath(); ctx.fill();
        } else if (this.type === 'striker') {
            ctx.rotate(this.angle * 0.9);
            ctx.fillStyle = '#66ccff';
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2.1);
            ctx.lineTo(this.width / 2.2, -this.height / 12);
            ctx.lineTo(this.width / 4, this.height / 2.1);
            ctx.lineTo(-this.width / 4, this.height / 2.1);
            ctx.lineTo(-this.width / 2.2, -this.height / 12);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(-3, -this.height / 4, 6, this.height / 2);
        } else if (this.type === 'warden') {
            ctx.fillStyle = '#aa33ff';
            ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
            ctx.strokeStyle = '#ff99ff'; ctx.lineWidth = 2; ctx.strokeRect(-this.width / 2, -this.height / 2, this.width, this.height);
            ctx.fillStyle = '#ffccff';
            ctx.beginPath(); ctx.arc(0, -10, 12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.20)';
            ctx.fillRect(-this.width / 4, 10, this.width / 2, 6);
            ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.moveTo(-this.width / 3, -this.height / 3); ctx.lineTo(this.width / 3, this.height / 3); ctx.moveTo(this.width / 3, -this.height / 3); ctx.lineTo(-this.width / 3, this.height / 3); ctx.stroke();
        } else if (this.type === 'elite') {
            ctx.rotate(this.angle * 0.8);
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2.1);
            ctx.lineTo(this.width / 2, -this.height / 5);
            ctx.lineTo(this.width / 2.1, this.height / 4);
            ctx.lineTo(0, this.height / 2.1);
            ctx.lineTo(-this.width / 2.1, this.height / 4);
            ctx.lineTo(-this.width / 2, -this.height / 5);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#ff99aa'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.16)';
            ctx.beginPath(); ctx.moveTo(-this.width / 4, -this.height / 8); ctx.lineTo(this.width / 4, -this.height / 8); ctx.lineTo(this.width / 6, this.height / 6); ctx.lineTo(-this.width / 6, this.height / 6); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
    }

    getBounds() {
        return { x: this.x - this.width / 2, y: this.y - this.height / 2, w: this.width, h: this.height };
    }

    takeDamage(damage) {
        this.hp -= damage;
        if (this.hp <= 0) { this.active = false; return true; }
        return false;
    }

    canShoot() {
        return (this.type === 'elite' || this.type === 'striker' || this.type === 'warden') && this.shootTimer >= this.shootInterval;
    }

    resetShoot() {
        this.shootTimer = 0;
    }
}

// ============================================
// ITEM DROP SYSTEM
// ============================================
class Item {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.active = true;
        this.size = 24;
        this.vy = 1.4;
        this.timer = 0;
        if (type === 'heal') {
            this.color = '#00ff88';
            this.icon = '❤️';
            this.label = 'Heal';
        } else if (type === 'shield') {
            this.color = '#33ccff';
            this.icon = '🛡️';
            this.label = 'Shield';
        } else {
            this.color = '#ffdd55';
            this.icon = '✨';
            this.label = 'Invul';
        }
    }

    update() {
        this.y += this.vy;
        this.timer += 1;
        if (this.timer % 20 < 10) this.x += Math.sin(this.timer * 0.3) * 0.7;
        if (this.y > canvas.height + 30) this.active = false;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.shadowBlur = 16;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 18px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.icon, 0, 6);
        ctx.restore();
    }

    getBounds() {
        return { x: this.x - this.size / 2, y: this.y - this.size / 2, w: this.size, h: this.size };
    }
}

// ============================================
// BOSS CLASS - ยักษ์ใหญ่ 3 ด่าน
// ============================================
class Boss {
    constructor(tier, gameWidth) {
        this.tier = tier; // 1, 2, 3
        this.active = true;
        this.x = gameWidth / 2;
        this.y = -150;
        this.targetY = 120;
        this.phase = 'enter'; // enter, idle, attack, dead
        this.phaseTimer = 0;
        this.angle = 0;
        this.id = 'boss_' + tier;
        this.shootTimer = 0;
        this.moveDir = 1;

        switch (tier) {
            case 1:
                this.maxHp = 200; this.hp = 200;
                this.width = 100; this.height = 100;
                this.color = '#ff4444';
                this.speed = 1.5;
                this.score = 5000;
                this.xpValue = 500;
                break;
            case 2:
                this.maxHp = 500; this.hp = 500;
                this.width = 140; this.height = 140;
                this.color = '#ff00ff';
                this.speed = 1.2;
                this.score = 12000;
                this.xpValue = 1200;
                break;
            case 3:
                this.maxHp = 1200; this.hp = 1200;
                this.width = 200; this.height = 200;
                this.color = '#ff0000';
                this.speed = 0.9;
                this.score = 30000;
                this.xpValue = 3000;
                break;
        }
    }

    update(playerX, playerY, time) {
        this.angle += 0.02;
        this.phaseTimer++;

        if (this.phase === 'enter') {
            this.y += 2;
            if (this.y >= this.targetY) {
                this.phase = 'idle';
                this.phaseTimer = 0;
            }
            return;
        }

        if (this.phase === 'dead') {
            this.y += 1;
            this.angle += 0.1;
            return;
        }

        // บอสเคลื่อนไหวแบบ Pattern
        this.x += this.speed * this.moveDir;
        if (this.x < this.width) { this.x = this.width; this.moveDir = 1; }
        if (this.x > canvas.width - this.width) { this.x = canvas.width - this.width; this.moveDir = -1; }

        // โจมตีตามรอบ
        this.shootTimer++;

        // บอสระดับ 3 มีพฤติกรรมซับซ้อน
        if (this.tier === 3) {
            this.y = this.targetY + Math.sin(time * 0.002) * 30;
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle * 0.3);

        // Glow รอบตัวบอส
        ctx.shadowBlur = 40;
        ctx.shadowColor = this.color;

        if (this.tier === 1) {
            // บอสด่าน 1: ยานรบขนาดกลาง ทรงเพชร
            ctx.fillStyle = '#220000';
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.lineTo(this.width / 2, 0);
            ctx.lineTo(0, this.height / 2);
            ctx.lineTo(-this.width / 2, 0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            // ตาบอส
            ctx.fillStyle = '#ff0000';
            ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffaaaa';
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
            // ปีก
            ctx.strokeStyle = '#ff6666'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-this.width / 2, 0); ctx.lineTo(-this.width * 0.8, -20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(this.width / 2, 0); ctx.lineTo(this.width * 0.8, -20); ctx.stroke();
        } else if (this.tier === 2) {
            // บอสด่าน 2: ยานทรงแมลงปีกกว้าง
            ctx.fillStyle = '#1a001a';
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 3;
            // ลำตัว
            ctx.beginPath();
            ctx.ellipse(0, 0, this.width / 3, this.height / 2, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            // ปีกซ้าย
            ctx.beginPath();
            ctx.moveTo(-this.width / 4, -10);
            ctx.quadraticCurveTo(-this.width * 0.7, -this.height * 0.6, -this.width / 3, this.height / 3);
            ctx.quadraticCurveTo(-this.width / 4, 0, -this.width / 4, -10);
            ctx.fill(); ctx.stroke();
            // ปีกขวา
            ctx.beginPath();
            ctx.moveTo(this.width / 4, -10);
            ctx.quadraticCurveTo(this.width * 0.7, -this.height * 0.6, this.width / 3, this.height / 3);
            ctx.quadraticCurveTo(this.width / 4, 0, this.width / 4, -10);
            ctx.fill(); ctx.stroke();
            // ตา
            ctx.fillStyle = '#ff00ff';
            ctx.beginPath(); ctx.arc(-15, -20, 12, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(15, -20, 12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(-15, -20, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(15, -20, 5, 0, Math.PI * 2); ctx.fill();
        } else if (this.tier === 3) {
            // บอสด่าน 3: ยักษ์ใหญ่อลังการ - ป้อมปราการบินได้
            ctx.fillStyle = '#1a0000';
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 4;
            // ฐานหลัก (octagon)
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = (Math.PI / 4) * i - Math.PI / 2;
                const r = this.width / 2.2;
                const px = Math.cos(a) * r;
                const py = Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath(); ctx.fill(); ctx.stroke();
            // วงใน
            ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, this.width / 3.5, 0, Math.PI * 2); ctx.stroke();
            // ตากลางยักษ์
            ctx.fillStyle = '#ff0000';
            ctx.shadowBlur = 30; ctx.shadowColor = '#ff0000';
            ctx.beginPath(); ctx.arc(0, -10, 28, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffff00';
            ctx.beginPath(); ctx.arc(0, -10, 14, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(0, -10, 6, 0, Math.PI * 2); ctx.fill();
            // ป้อมปืน 4 มุม
            ctx.shadowBlur = 20; ctx.shadowColor = '#ff6600';
            ctx.fillStyle = '#ff4400';
            const turretPos = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
            turretPos.forEach(([sx, sy]) => {
                ctx.beginPath();
                ctx.arc(sx * this.width / 3, sy * this.height / 3, 18, 0, Math.PI * 2);
                ctx.fill();
            });
            // แหวนรอบนอกหมุน
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            const ringR = this.width / 2 + 15;
            for (let i = 0; i < 12; i++) {
                const a = (Math.PI / 6) * i + this.angle;
                const px = Math.cos(a) * ringR;
                const py = Math.sin(a) * ringR;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath(); ctx.stroke();
        }

        ctx.restore();
    }

    getBounds() {
        return { x: this.x - this.width / 2, y: this.y - this.height / 2, w: this.width, h: this.height };
    }

    takeDamage(damage) {
        this.hp -= damage;
        if (this.hp <= 0) {
            this.hp = 0;
            this.phase = 'dead';
            this.active = false;
            return true;
        }
        return false;
    }

    getBossBullets() {
        const bullets = [];
        const patterns = [
            // Pattern 0: ยิงตรง 3 นัด
            [{ vx: 0, vy: 6 }],
            // Pattern 1: กระจาย 5 นัด
            [{ vx: -3, vy: 5 }, { vx: -1.5, vy: 6 }, { vx: 0, vy: 7 }, { vx: 1.5, vy: 6 }, { vx: 3, vy: 5 }],
            // Pattern 2: วงกลม 8 ทิศ
            Array.from({ length: 8 }, (_, i) => {
                const a = (Math.PI / 4) * i;
                return { vx: Math.cos(a) * 5, vy: Math.sin(a) * 5 };
            })
        ];

        let patternIdx = 0;
        if (this.tier === 2) patternIdx = this.shootTimer % 200 < 100 ? 1 : 0;
        if (this.tier === 3) {
            if (this.shootTimer % 300 < 100) patternIdx = 2;
            else if (this.shootTimer % 300 < 200) patternIdx = 1;
            else patternIdx = 0;
        }

        const pattern = patterns[patternIdx];
        pattern.forEach(p => {
            bullets.push(new Bullet(this.x, this.y + this.height / 3, p.vy, '#ff3333', {
                vx: p.vx, isEnemy: true, damage: this.tier
            }));
        });

        return bullets;
    }
}

// ============================================
// PLAYER - โมเดลใหม่สวยงามอลังการ
// ============================================
class Player {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.width = 50; this.height = 60;
        this.defaultSpeed = 4.4;
        this.baseSpeed = this.defaultSpeed;
        this.speed = this.baseSpeed;
        this.hp = 100; this.maxHp = 100;
        this.color = '#00e5ff';
        this.shootCooldown = 0; this.shootDelay = 10;
        this.engineTimer = 0; this.invulnerable = 0;
        this.level = 1; this.xp = 0; this.xpToNext = 120;
        this.powers = new Map();
        this.shotCount = 1; this.pierceCount = 0;
        this.shield = 0; this.shieldMax = 0;
        this.bulletDamage = 1; this.bulletSpeed = 12; this.armor = 0; this.regenRate = 0; this.regenTimer = 0;
        this.orbitCount = 0; this.vampireRate = 0; this.heartSlots = 0;
        this.wingAngle = 0;
    }

    gainXp(amount) {
        this.xp += amount;
        if (this.xp >= this.xpToNext) {
            this.xp -= this.xpToNext;
            this.level++;
            this.xpToNext = Math.floor(this.xpToNext * 1.75);
            return true;
        }
        return false;
    }

    recalcStats() {
        this.shootDelay = 10; this.shotCount = 1; this.pierceCount = 0;
        this.shieldMax = 0; this.baseSpeed = this.defaultSpeed; this.bulletDamage = 1; this.bulletSpeed = 12; this.armor = 0; this.regenRate = 0;
        this.orbitCount = 0; this.vampireRate = 0; this.heartSlots = 0;
        this.maxHp = 100;
        for (const power of this.powers.values()) power.apply(this);
        this.speed = this.baseSpeed;
        this.hp = Math.min(this.hp, this.maxHp);
    }

    addPower(powerId) {
        const PowerClass = POWER_REGISTRY[powerId];
        if (!PowerClass) return false;
        if (this.powers.has(powerId)) {
            const p = this.powers.get(powerId);
            if (p.canUpgrade()) { p.upgrade(); p.apply(this); return true; }
            return false;
        } else {
            const np = new PowerClass();
            np.upgrade();
            this.powers.set(powerId, np);
            np.apply(this);
            return true;
        }
    }

    update(input, canvasWidth, canvasHeight) {
        this.speed = this.baseSpeed;
        if (input.left) this.x -= this.speed;
        if (input.right) this.x += this.speed;
        if (input.up) this.y -= this.speed;
        if (input.down) this.y += this.speed;
        this.x = Math.max(this.width / 2, Math.min(canvasWidth - this.width / 2, this.x));
        this.y = Math.max(this.height / 2, Math.min(canvasHeight - this.height / 2, this.y));
        if (this.shootCooldown > 0) this.shootCooldown--;
        this.engineTimer++;
        if (this.invulnerable > 0) this.invulnerable--;
        this.wingAngle = Math.sin(this.engineTimer * 0.05) * 0.1;
        if (this.regenRate > 0 && this.hp < this.maxHp) {
            this.regenTimer++;
            const threshold = Math.max(30, 180 - this.regenRate * 40);
            if (this.regenTimer >= threshold) { this.regenTimer = 0; this.hp = Math.min(this.maxHp, this.hp + 1); }
        }
    }

    draw(ctx) {
        if (this.invulnerable > 0 && Math.floor(this.invulnerable / 4) % 2 === 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);

        // เกราะ
        if (this.shield > 0) {
            ctx.strokeStyle = `rgba(0, 200, 255, ${0.25 + this.shield * 0.12})`;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 20; ctx.shadowColor = '#00ccff';
            ctx.beginPath();
            ctx.arc(0, 0, this.width * 1.0 + Math.sin(Date.now() / 150) * 4, 0, Math.PI * 2);
            ctx.stroke(); ctx.shadowBlur = 0;
        }

        // ไฟท้ายเครื่องยนต์ (2 จุด)
        const flameH1 = 16 + Math.random() * 14;
        const flameH2 = 14 + Math.random() * 12;
        ctx.fillStyle = '#0088ff';
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.moveTo(-14, this.height / 2 - 6);
        ctx.lineTo(-8, this.height / 2 + flameH1);
        ctx.lineTo(-2, this.height / 2 - 6);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(2, this.height / 2 - 6);
        ctx.lineTo(8, this.height / 2 + flameH2);
        ctx.lineTo(14, this.height / 2 - 6);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;

        // ไฟกลาง (พลังงานหลัก)
        ctx.fillStyle = '#00ccff';
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.moveTo(-6, this.height / 2 - 4);
        ctx.lineTo(0, this.height / 2 + 22 + Math.random() * 8);
        ctx.lineTo(6, this.height / 2 - 4);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;

        // ปีกซ้าย
        ctx.save();
        ctx.rotate(-0.15 + this.wingAngle);
        ctx.fillStyle = '#001a33';
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 15; ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.moveTo(-8, -5);
        ctx.lineTo(-this.width / 2 - 5, this.height / 2 - 10);
        ctx.lineTo(-12, this.height / 2 - 5);
        ctx.lineTo(-6, 5);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();

        // ปีกขวา
        ctx.save();
        ctx.rotate(0.15 - this.wingAngle);
        ctx.fillStyle = '#001a33';
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 15; ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.moveTo(8, -5);
        ctx.lineTo(this.width / 2 + 5, this.height / 2 - 10);
        ctx.lineTo(12, this.height / 2 - 5);
        ctx.lineTo(6, 5);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();

        // ลำตัวหลัก (ทรงสามเหลี่ยมไฮเทค)
        ctx.fillStyle = '#001a2e';
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.shadowBlur = 30; ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.moveTo(0, -this.height / 2 - 5); // หัวแหลม
        ctx.lineTo(this.width / 2 - 2, this.height / 2 - 8);
        ctx.lineTo(0, this.height / 2 - 18); // ซอกหาง
        ctx.lineTo(-this.width / 2 + 2, this.height / 2 - 8);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // แถบไฟ LED รอบลำตัว
        ctx.strokeStyle = 'rgba(0, 230, 255, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -this.height / 2 + 10);
        ctx.lineTo(0, this.height / 2 - 20);
        ctx.stroke();

        // ค็อกพิท (เรืองแสง)
        ctx.fillStyle = '#00ffff';
        ctx.shadowBlur = 20; ctx.shadowColor = '#00ffff';
        ctx.beginPath(); ctx.arc(0, -8, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, -8, 3, 0, Math.PI * 2); ctx.fill();

        // ปืนข้าง
        ctx.fillStyle = '#003344';
        ctx.strokeStyle = '#00aacc';
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 8; ctx.shadowColor = '#00aacc';
        ctx.fillRect(-22, -5, 6, 18);
        ctx.strokeRect(-22, -5, 6, 18);
        ctx.fillRect(16, -5, 6, 18);
        ctx.strokeRect(16, -5, 6, 18);

        ctx.restore();
    }

    canShoot() { return this.shootCooldown <= 0; }

    shoot() {
        this.shootCooldown = this.shootDelay;
        const bullets = [];
        const count = this.shotCount;
        const spreadAngle = Math.min(70, (count - 1) * 10);
        const startAngle = -spreadAngle / 2;
        const step = count > 1 ? spreadAngle / (count - 1) : 0;
        for (let i = 0; i < count; i++) {
            const angleDeg = startAngle + step * i;
            const angleRad = (angleDeg - 90) * (Math.PI / 180);
            const speed = this.bulletSpeed || 12;
            const vx = Math.cos(angleRad) * speed;
            const vy = Math.sin(angleRad) * speed;
            bullets.push(new Bullet(this.x, this.y - this.height / 2, vy, '#00ffff', {
                vx: vx, damage: this.bulletDamage, pierce: this.pierceCount
            }));
        }
        if (this.orbitCount > 0) {
            for (let i = 0; i < this.orbitCount; i++) {
                const orbitAngle = (Math.PI * 2 * i) / Math.max(1, this.orbitCount) + (this.engineTimer * 0.09);
                const orbitSpeed = 7.5;
                const orbitVx = Math.cos(orbitAngle) * orbitSpeed;
                const orbitVy = Math.sin(orbitAngle) * orbitSpeed - 1.5;
                bullets.push(new Bullet(this.x, this.y - this.height / 2, orbitVy, '#7df9ff', {
                    vx: orbitVx, damage: this.bulletDamage, pierce: Math.max(this.pierceCount, 1)
                }));
            }
        }
        return bullets;
    }

    takeDamage(amount) {
        if (this.invulnerable > 0) return false;
        let reduced = amount;
        if (this.armor > 0) reduced = Math.max(1, amount - this.armor);
        if (this.shield > 0) { this.shield--; this.invulnerable = 30; return true; }
        this.hp -= reduced;
        if (this.hp < 0) this.hp = 0;
        this.invulnerable = 60;
        return true;
    }

    getBounds() {
        const shrink = 5;
        return { x: this.x - this.width / 2 + shrink, y: this.y - this.height / 2 + shrink, w: this.width - shrink * 2, h: this.height - shrink * 2 };
    }
}

class PowerUp {
    constructor(id, name, description, icon, maxLevel, color) {
        this.id = id; this.name = name; this.description = description;
        this.icon = icon;
        this.maxLevel = maxLevel;
        this.level = 0;
        this.color = color;
    }
    apply(player) {}
    getLevelDescription() { return this.description; }
    canUpgrade() { return this.level < this.maxLevel; }
    upgrade() { if (this.canUpgrade()) { this.level++; return true; } return false; }
    drawIcon(ctx, x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-size * 0.3, size * 0.05);
        ctx.lineTo(0, -size * 0.35);
        ctx.lineTo(size * 0.3, size * 0.05);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, size * 0.08, size * 0.08, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
}
